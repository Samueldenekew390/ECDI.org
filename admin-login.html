<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | Ethiopian Community Development Initiative (ECDI)</title>
  
  <meta name="description" content="Secure Administrator Authentication Portal for ECDI.">
  <link rel="canonical" href="https://ais-pre-5qdncpqr7r3j3ixccv6gx5-785328023687.europe-west2.run.app/admin-login.html">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/application.css">
</head>
<body class="bg-[#1A1A1A] text-[#F5F5F0] font-sans min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white text-slate-900 rounded-3xl p-8 sm:p-10 shadow-2xl space-y-6">
    
    <!-- Logo & Title -->
    <div class="text-center space-y-3">
      <a href="index.html" class="inline-block" title="Ethiopian Community Development Initiative (ECDI)">
        <img src="/assets/ecdi-logo.png" alt="Ethiopian Community Development Initiative (ECDI) Logo" class="ecdi-logo-auth">
      </a>
      <div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Admin Dashboard Portal</h1>
        <p class="text-xs text-slate-500 font-medium mt-0.5">Ethiopian Community Development Initiative (ECDI)</p>
      </div>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="return false;" class="space-y-4">
      
      <div>
        <label for="username" class="form-label">Administrator Email / Username</label>
        <input 
          type="text" 
          id="username" 
          class="form-input text-sm" 
          placeholder="admin@ecdi.org.et" 
          value="admin@ecdi.org.et"
          required
        >
      </div>

      <div>
        <label for="password" class="form-label">Password</label>
        <input 
          type="password" 
          id="password" 
          class="form-input text-sm" 
          placeholder="••••••••••••" 
          value="ecdi_admin_secure_2026"
          required
        >
      </div>

      <div class="flex items-center justify-between text-xs">
        <label class="flex items-center gap-2 text-slate-600 font-medium cursor-pointer">
          <input type="checkbox" id="rememberMe" checked class="accent-emerald-700">
          Remember session
        </label>
      </div>

      <div id="login-error" class="p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-xs hidden"></div>

      <button 
        type="button" 
        id="loginBtn" 
        class="btn-primary w-full py-3.5 text-sm justify-center shadow-lg bg-emerald-700 hover:bg-emerald-800"
      >
        Sign In to Admin Dashboard
      </button>

    </form>

    <div class="pt-4 border-t border-slate-100 text-center">
      <a href="index.html" class="text-xs font-semibold text-slate-500 hover:text-slate-800">
        ← Return to Public Homepage
      </a>
    </div>

  </div>

  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module">
    document.addEventListener("DOMContentLoaded", () => {
      // Check if already authenticated
      if (window.ECDIAuth.isAuthenticated()) {
        window.location.href = "/admin.html";
        return;
      }

      const loginBtn = document.getElementById("loginBtn");
      const loginError = document.getElementById("login-error");

      loginBtn.addEventListener("click", async () => {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const remember = document.getElementById("rememberMe").checked;

        if (!username || !password) {
          loginError.textContent = "Please provide both username and password.";
          loginError.classList.remove("hidden");
          return;
        }

        loginError.classList.add("hidden");
        loginBtn.disabled = true;
        loginBtn.innerHTML = `Signing in...`;

        try {
          await window.ECDIAuth.login(username, password, remember);
          window.showToast("Signed in successfully!", "success");
          setTimeout(() => {
            window.location.href = "/admin.html";
          }, 800);
        } catch (err) {
          loginError.textContent = err.message || "Invalid login credentials.";
          loginError.classList.remove("hidden");
          loginBtn.disabled = false;
          loginBtn.innerHTML = `Sign In to Admin Dashboard`;
        }
      });
    });
  </script>
</body>
</html>
